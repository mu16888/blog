# ===== 基础 =====
baseURL: "https://mufeng168.top/"
title: "沐风"
pagination:
  pagerSize: 6          # 新版写法；旧键名 paginate 自 v0.128 起被移除（Cloudflare 用 v0.147 会直接报错）
theme: "PaperMod"
enableGitInfo: false
locale: zh-cn

# ===== 顶部菜单 =====
menu:
  main:
    - identifier: home
      name: "首页"
      url: "/"
      weight: 1
    - identifier: posts
      name: "博客"
      url: "/posts/"
      weight: 2
    - identifier: about
      name: "关于"
      url: "/about/"
      weight: 3

# ===== 主题参数（PaperMod）=====
params:
  env: production
  description: "沐风的个人综合博客与 IP 承接落地页"
  author: "沐风"

  # 首页 profile 模式 = IP 落地页核心
  profileMode:
    enabled: true
    title: "沐风"
    subtitle: "个人综合博客 · IP 承接落地页｜分享实战经验与好物"
    imageUrl: "/avatar.jpg"          # 头像（锋哥知乎同款红圈金龙 logo）
    imageHeight: 120
    buttons:
      - name: "博客"
        url: posts
      - name: "关于我"
        url: about

  # 社交 / 转化入口（微信、知乎、邮箱；小红书暂不加）
  socialIcons:
    - name: "wechat"                       # 微信：点开显示二维码图（微信号 mufeng51777）
      url: "/wechat-qr.jpg"
    - name: "zhihu"                        # 知乎
      url: "https://www.zhihu.com/people/mufeng5558"
    - name: "email"                        # 邮箱
      url: "mailto:hello@mufeng168.top"

  # 文章页开关
  ShowPostThumbnails: true   # 列表/首页显示文章封面图（需在文章 front matter 加 images: ["/covers/xxx.jpg"]）
  ShowReadingTime: true
  ShowShareButtons: true
  ShowToc: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
