{{/* 文章分享条：复制链接 / 微信 / 微博 / QQ / 邮件 */}}
<div class="share-bar">
  <span class="share-bar__label">分享：</span>
  <button type="button" data-share="copy">复制链接</button>
  <a class="share-btn" data-share="wechat" href="javascript:void(0)" role="button">微信</a>
  <a class="share-btn" href="https://service.weibo.com/share/share.php?url={{ .Permalink | urlquery }}&amp;title={{ .Title | urlquery }}" target="_blank" rel="noopener">微博</a>
  <a class="share-btn" href="https://connect.qq.com/widget/shareqq/index.html?url={{ .Permalink | urlquery }}&amp;title={{ .Title | urlquery }}" target="_blank" rel="noopener">QQ</a>
  <a class="share-btn" href="mailto:?subject={{ .Title | urlquery }}&amp;body={{ .Permalink | urlquery }}" rel="noopener">邮件</a>
  <span class="share-bar__toast" id="share-toast"></span>
</div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var copyBtn = document.querySelector('[data-share="copy"]');
  if(copyBtn){
    copyBtn.addEventListener('click', function(){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(window.location.href).then(function(){
          var t=document.getElementById('share-toast');
          if(t){ t.textContent='已复制链接'; setTimeout(function(){ t.textContent=''; }, 2000); }
        }).catch(function(){});
      }
    });
  }
  var wxBtn = document.querySelector('[data-share="wechat"]');
  if(wxBtn){
    wxBtn.addEventListener('click', function(){
      var u = encodeURIComponent(window.location.href);
      window.open('https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + u, '_blank');
    });
  }
});
</script>
