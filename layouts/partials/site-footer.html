<footer class="site-footer">
    <!-- 底部不再放联系卡 / 公众号码：联系方式已移到右侧栏「联系沐风」模块，
         公众号码只在右上角「注册 / 登录」弹窗中展示，避免重复与不协调 -->
    <p>
        &copy; {{ now.Year }} {{ .Site.Title }}
        {{ with .Site.Copyright }} - {{ . }}{{ end }}
    </p>

    <!-- 站点 PV / UV 统计（自建 CloudBase 通道，替代不稳定的第三方不蒜子；加载失败显示 0，不影响页面） -->
    <p class="site-footer__busuanzi">
        本站总访问 <span id="site-pv">0</span> 次
        &nbsp;·&nbsp;
        访客 <span id="site-uv">0</span> 人
    </p>
    <script src="/js/site-stats.js?{{ partial "helpers/asset-version.html" "js/site-stats.js" }}" defer></script>
</footer>
